  <style>
    @keyframes earLeft {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-8deg); }
      70% { transform: rotate(3deg); }
    }
    @keyframes earRight {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(8deg); }
      70% { transform: rotate(-3deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.25; transform: scale(0.75); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .ear-left { transform-origin: 43px 47px; animation: earLeft 2.8s ease-in-out infinite; }
    .ear-right { transform-origin: 77px 47px; animation: earRight 2.8s ease-in-out infinite; }
    .sparkle-1 { transform-box: fill-box; transform-origin: center; animation: sparkle 2.8s ease-in-out infinite; }
    .sparkle-2 { transform-box: fill-box; transform-origin: center; animation: sparkle 2.8s ease-in-out 0.9s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .ear-left, .ear-right, .sparkle-1, .sparkle-2 { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
