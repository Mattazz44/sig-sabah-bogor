<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 120 120" fill="none">
  <title>Maskot Rusa Tutul Sabah Bogor - Role Admin</title>
  <style>
    @keyframes adminHead {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      32% { transform: translateY(1.6px) rotate(-2.8deg); }
      68% { transform: translateY(-0.4px) rotate(1.8deg); }
    }
    @keyframes adminPen {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(-2px, -3.5px) rotate(-6deg); }
      48% { transform: translate(0.8px, 1.5px) rotate(3deg); }
      72% { transform: translate(-1.5px, -2.2px) rotate(-4.5deg); }
    }
    @keyframes adminCheck {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      42%, 58% { opacity: 1; transform: scale(1.1); }
    }
    .admin-head { transform-origin: 60px 74px; animation: adminHead 4s ease-in-out infinite; }
    .admin-pen { transform-origin: 74px 96px; animation: adminPen 4s ease-in-out infinite; }
    .admin-check { transform-box: fill-box; transform-origin: center; animation: adminCheck 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .admin-head, .admin-pen, .admin-check { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
